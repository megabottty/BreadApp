name: Notification scheduler

# Render's free tier sleeps between requests, so the daily jobs (rolling
# subscription bake dates forward, the Thursday "want your bread this week?"
# check-in, and prep alerts) are kicked off from here instead of an in-process
# timer. 15:00 UTC = 9:00am Mountain (8:00am during daylight saving).
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the daily notification run
        run: |
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}" \
            https://thedailydough.store/api/notifications-scheduler/run
