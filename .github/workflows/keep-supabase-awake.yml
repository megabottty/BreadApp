name: Keep App and Supabase Awake

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Ping Render Backend
        run: |
          curl -v -L --retry 3 --retry-delay 5 -f -i -X GET "https://bread-app-backend.onrender.com/api/ping"

      - name: Ping Supabase Directly
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          # Fallback to hardcoded values if secrets are not set
          if [ -z "$URL" ]; then
            URL="https://vciwftypjimwpsgcwyan.supabase.co"
          fi
          if [ -z "$KEY" ]; then
            KEY="sb_publishable_RtQtGr_kMakhlU68ItMyzg_rB9eKbhp"
          fi

          echo "Pinging Supabase at $URL..."
          curl -v -L --retry 3 --retry-delay 5 -f -i -X GET "$URL/rest/v1/" \
          -H "apikey: $KEY" \
          -H "Authorization: Bearer $KEY"
