<div class="login-container">
  <div class="login-card">
    <header>
      <span class="logo-icon">🌾</span>
      <h1>Welcome Back</h1>
      <p class="subtitle">Join us in the daily dough journey</p>
    </header>

    <div class="role-toggle" role="radiogroup" aria-label="Select your role">
      <button type="button"
              [class.active]="selectedRole() === 'CUSTOMER'"
              (click)="setRole('CUSTOMER')"
              role="radio"
              [attr.aria-checked]="selectedRole() === 'CUSTOMER'">Bread Lover</button>
      <button type="button"
              [class.active]="selectedRole() === 'BAKER'"
              (click)="setRole('BAKER')"
              role="radio"
              [attr.aria-checked]="selectedRole() === 'BAKER'">The Baker</button>
    </div>

    <form (submit)="login()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" placeholder="hello@dailydough.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input [type]="showPassword() ? 'text' : 'password'" id="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" placeholder="••••••••" required>
          <button type="button" class="btn-toggle-password"
                  (click)="togglePassword()"
                  [attr.aria-label]="showPassword() ? 'Hide Password' : 'Show Password'"
                  [title]="showPassword() ? 'Hide Password' : 'Show Password'">
            <span aria-hidden="true">{{ showPassword() ? '👁️' : '👁️‍🗨️' }}</span>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login">
        Login as {{ selectedRole() === 'BAKER' ? 'Head Baker' : 'Bread Lover' }}
      </button>
    </form>

    <footer>
      <p>Don't have an account? <a [routerLink]="['/register']" [queryParams]="{ role: selectedRole() }">Create one</a></p>
    </footer>
  </div>
</div>
