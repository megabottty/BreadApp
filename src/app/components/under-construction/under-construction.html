<div class="under-construction-container">
  <div class="content">
    <div class="icon">🏗️</div>
    <h1>Page Under Construction</h1>
    <p>We're currently working on some improvements to bring you a better experience.</p>
    <div class="contact-box">
      <p>Please reach out directly to <strong>{{ name }}</strong> at:</p>
      <a [href]="'tel:' + phone" class="phone-number">{{ phone }}</a>
      <div style="margin-top:1rem;">
        <a routerLink="/login" class="btn-login">Login</a>
      </div>
    </div>
  </div>
</div>
