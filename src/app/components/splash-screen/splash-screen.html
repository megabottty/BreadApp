@if (isVisible()) {
  <div class="splash-overlay" [class.fade-out]="!isOverlayVisible()">
    <div class="splash-content">
      <div class="bakery-animation">
        <span class="emoji">🌾</span>
        <span class="emoji">🍞</span>
        <span class="emoji">🥖</span>
      </div>
      <h1>The Daily Dough</h1>
      <p class="message">{{message()}}</p>

      @if (isMaintenanceMode() && animationDone()) {
        <div class="maintenance-notice">
          <p>We're currently updating our kitchen to serve you better.</p>
          <p>Please check back soon!</p>
          <div class="contact-info">
            <p>Need something urgently?</p>
            <a href="tel:801-471-8218" class="btn-contact">Call Megan</a>
          </div>
        </div>
      } @else {
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      }
    </div>
  </div>
}
